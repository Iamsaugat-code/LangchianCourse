[project]
name = "mylangchain"
version = "0.1.0"
description = "i am hero of langchain here"
readme = "README.md"
authors = [
    { name = "Iamsaugat-code", email = "raisaugat1415@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.7",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
mylangchain = "mylangchain:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
